<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Love Analyzer 3000 ❤️</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container" id="container">
      <h1>❤️ Lucifer's Love Analyzer 3000™</h1>

      <p class="subtitle">
        Hold your finger on the heart for measuring love intensity. The analyzer
        will scan your love level and display the results below.
      </p>

      <div class="heart" id="heart">❤️</div>

      <div class="status" id="status">Hold the heart to scan...</div>

      <div class="reading" id="reading">0%</div>
      <div class="result-screen" id="resultScreen">
        <div class="analyzer-display">
          <h2 id="resultTitle">❤️ LOVE ANALYZER ❤️</h2>

          <div id="resultNumber">--</div>

          <p id="resultMessage">Initializing...</p>
        </div>
      </div>
      <div class="crazy-reel-screen" id="crazyReelScreen">
        <div class="slot-window">
          <div class="reel-track" id="crazyReelTrack"></div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
